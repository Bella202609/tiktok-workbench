<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Shop 工作台</title><style>:root{--p:#7c5ce5;--pl:#f1edff;--ink:#35245f}*{box-sizing:border-box}body{font-family:system-ui;margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(135deg,#faf8ff,#eee8ff)}header{padding:42px 40px;background:linear-gradient(120deg,#a995f3,#d8ceff);border-bottom:1px solid #c9bbff}h1{margin:0 0 8px;font-size:32px}main{max-width:1000px;margin:28px auto;padding:0 24px;display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}.card{background:#fff;border:1px solid #e5ddff;border-radius:18px;padding:22px;box-shadow:0 8px 24px #7860c51c}.label{color:#765bc9;font-size:14px}.value{font-size:22px;font-weight:700;margin-top:10px}#status{color:#5942a0}</style><header><h1>TikTok Shop 工作台</h1><p id="status">正在检查服务…</p></header><main><div class=card><div class=label>商品</div><div class=value>待同步</div></div><div class=card><div class=label>订单</div><div class=value>待同步</div></div><div class=card><div class=label>库存</div><div class=value>待同步</div></div><div class=card><div class=label>店铺信息</div><div class=value>待同步</div></div><div class=card><div class=label>佣金 / 财务</div><div class=value>待同步</div></div><div class=card><div class=label>售后 / 退货</div><div class=value>待同步</div></div></main><script>fetch("/health").then(r=>r.json()).then(x=>status.textContent="服务正常 · "+x.service).catch(()=>status.textContent="服务检查失败")</script></html>
