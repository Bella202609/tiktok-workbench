<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Shop 工作台</title><style>body{margin:0;font:14px system-ui;color:#332650;background:linear-gradient(135deg,#fcfbff,#f0ebff)}header{padding:28px 5%;background:#c7b8ff}main{max-width:1100px;margin:20px auto;padding:0 18px}.tabs{display:flex;gap:8px;margin:18px 0}.tab,button{padding:10px 15px;border:1px solid #e5ddff;border-radius:10px;background:#fff;color:#6e50d1}.tab.active,.primary{background:#8d72e8;color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #eee8ff;border-radius:16px;padding:18px;box-shadow:0 8px 24px #6948b20b}.wide{grid-column:span 2}.label{color:#765bc9}.big{font-size:27px;font-weight:800;margin-top:10px}.muted{color:#857b99}.chat{height:80px;width:100%;border:1px solid #eee8ff;border-radius:10px;padding:10px;box-sizing:border-box}@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.wide{grid-column:span 2}}</style><header><h1>TikTok Shop 工作台</h1><p>法国店铺 RUICUBEI · 数据实时查询</p></header><main><div class="tabs"><button class="tab active" data-days="3">近 3 天</button><button class="tab" data-days="7">近 7 天</button><button class="tab" data-days="30">近 30 天</button><button class="tab" id="custom">自定义时间</button></div><div class="grid"><div class="card"><div class="label">当前周期 GMV</div><div class="big" id="gmv">加载中…</div></div><div class="card"><div class="label">订单总数</div><div class="big" id="orders">加载中…</div></div><div class="card"><div class="label">商品件数</div><div class="big" id="items">加载中…</div></div><div class="card"><div class="label">店铺状态</div><div class="big">正常</div></div><div class="card wide"><h3>产品经理对话</h3><p class="muted">收集你的需求并整理为产品任务</p><textarea class="chat" id="need" placeholder="输入你的需求"></textarea><br><button class="primary" id="send">提交需求</button><span id="msg" class="muted"></span></div><div class="card wide"><h3>业务模块</h3><p>商品管理　订单管理　库存履约　物流　售后退货　财务佣金　广告 GMV</p></div></div></main><script>async function load(days){try{const r=await fetch('/api/tiktok/performance?days='+days),j=await r.json();if(j.ok){gmv.textContent='€'+Number(j.summary.gmv).toFixed(2);orders.textContent=j.summary.orders;items.textContent=j.summary.items_sold}}catch(e){gmv.textContent='暂不可用'}}document.querySelectorAll('.tab[data-days]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.days)});send.onclick=()=>msg.textContent=need.value?' 已收到，正在整理需求':' 请先填写需求';load(3)</script></html>
