<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TikTok Shop 工作台</title><style>:root{--p:#8d72e8;--ink:#332650;--line:#eee8ff}*{box-sizing:border-box}body{margin:0;font:14px system-ui;color:var(--ink);background:#f6f2ff}.app{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid var(--line);padding:22px 14px}.brand{font-size:18px;font-weight:800;padding:8px 10px 24px}.nav{padding:11px 12px;margin:4px 0;border-radius:11px;color:#6c6380}.nav.active,.nav:hover{background:#f0ebff;color:#6e50d1;font-weight:700}.section{margin:20px 10px 8px;color:#a19ab2;font-size:11px;font-weight:700}.main{flex:1}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);padding:0 30px;display:flex;justify-content:space-between;align-items:center}.content{padding:28px;max-width:1250px}.tabs{display:flex;gap:8px;margin:20px 0}.tab,button{padding:10px 15px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#6e50d1}.tab.active,.primary{background:var(--p);color:#fff}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 8px 24px #6948b20b}.wide{grid-column:span 2}.label{color:#765bc9}.big{font-size:27px;font-weight:800;margin-top:10px}.muted{color:#857b99}.chat{height:80px;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;box-sizing:border-box}@media(max-width:800px){.side{width:70px}.brand span,.nav span,.section{display:none}.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.side{display:none}.grid{grid-template-columns:1fr}.wide{grid-column:span 1}}</style><div class="app"><aside class="side"><div class="brand">🟣 <span>Shop 工作台</span></div><div class="section">工作空间</div><div class="nav active">⌂　<span>总览</span></div><div class="nav">↔　<span>授权与连接</span></div><div class="section">业务管理</div><div class="nav">▦　<span>商品管理</span></div><div class="nav">▤　<span>订单管理</span></div><div class="nav">▥　<span>库存与履约</span></div><div class="nav">⌁　<span>物流管理</span></div><div class="nav">↩　<span>售后与退货</span></div><div class="section">经营分析</div><div class="nav">€　<span>财务与佣金</span></div><div class="nav">⌁　<span>广告与 GMV</span></div><div class="nav">◷　<span>同步记录</span></div><div class="section">系统</div><div class="nav">⚙　<span>设置</span></div></aside><main class="main"><header class="top"><span class="muted">工作空间 / <b>总览</b></span><span>🇫🇷 RUICUBEI　⌄</span></header><div class="content"><h1>店铺经营总览</h1><p class="muted">按时间范围查看 GMV、订单与经营表现</p><div class="tabs"><button class="tab active" data-days="3">近 3 天</button><button class="tab" data-days="7">近 7 天</button><button class="tab" data-days="30">近 30 天</button></div><section class="grid"><div class="card"><div class="label">当前周期 GMV</div><div class="big" id="gmv">加载中…</div></div><div class="card"><div class="label">订单总数</div><div class="big" id="orders">加载中…</div></div><div class="card"><div class="label">商品件数</div><div class="big" id="items">加载中…</div></div><div class="card"><div class="label">店铺状态</div><div class="big">正常</div></div><div class="card wide"><h3>产品经理对话</h3><p class="muted">收集需求并整理为产品任务</p><textarea class="chat" id="need" placeholder="输入你的需求"></textarea><br><button class="primary" id="send">提交需求</button><span id="msg" class="muted"></span></div></section></div></main></div><script>async function load(days){const r=await fetch('/api/tiktok/performance?days='+days),j=await r.json();if(j.ok){gmv.textContent='€'+Number(j.summary.gmv).toFixed(2);orders.textContent=j.summary.orders;items.textContent=j.summary.items_sold}}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');load(b.dataset.days)});send.onclick=()=>msg.textContent=need.value?' 已收到需求':' 请填写需求';load(3)</script></html>
